server {
        listen 80;
            location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /schools/ {
        proxy_pass http://school-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

        location /ingest {
        proxy_pass http://data-ingestion-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}